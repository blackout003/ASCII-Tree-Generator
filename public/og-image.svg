<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Arrière-plan -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Motif de fond -->
  <g opacity="0.1">
    <text x="50" y="100" font-family="monospace" font-size="24" fill="#1f2937">├── src/</text>
    <text x="50" y="130" font-family="monospace" font-size="24" fill="#1f2937">│   ├── components/</text>
    <text x="50" y="160" font-family="monospace" font-size="24" fill="#1f2937">│   └── pages/</text>
    <text x="50" y="190" font-family="monospace" font-size="24" fill="#1f2937">└── public/</text>
  </g>
  
  <!-- Contenu principal -->
  <g>
    <!-- Titre principal -->
    <text x="60" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="bold" fill="#1f2937">
      ASCII Tree Generator
    </text>
    
    <!-- Sous-titre -->
    <text x="60" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#3b82f6">
      Créez des structures de projet visuelles
    </text>
    
    <!-- Description -->
    <text x="60" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#1f2937" opacity="0.8">
      Générateur d'arbre ASCII gratuit et intuitif
    </text>
    
    <!-- Call-to-action -->
    <rect x="60" y="480" width="200" height="50" rx="8" fill="#3b82f6"/>
    <text x="160" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
      Commencer
    </text>
  </g>
  
  <!-- Logo/icône -->
  <g transform="translate(1000, 100)">
    <rect width="80" height="80" rx="12" fill="#3b82f6"/>
    <text x="40" y="50" font-family="monospace" font-size="32" fill="white" text-anchor="middle">🌳</text>
  </g>
</svg>